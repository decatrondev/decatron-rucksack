# Decatron Rucksack - Configuracion principal
# Documentacion: https://rucksack.decatron.net

storage:
  type: sqlite  # sqlite | mysql | h2
  mysql:
    host: localhost
    port: 3306
    database: rucksack
    username: root
    password: ''

language: es  # es | en

# Colocacion de la mochila en la espalda.
# No edites esto a mano: entra al juego en tercera persona (F5) y usa
#   /rucksack ajuste            -> ver valores actuales
#   /rucksack ajuste altura +   -> mover de a un paso
#   /rucksack ajuste paso 0.01  -> afinar el tamano del paso
#   /rucksack ajuste guardar    -> escribir los valores aca
render:
  espalda:
    separacion: 0.10   # distancia hacia atras desde la espalda
    altura: 1.25       # altura desde los pies
    lateral: 0.0       # corrimiento a los costados (+ derecha, - izquierda)
    escala: 0.85       # tamano del modelo
    giro: 180.0        # orientacion, en grados
    inclinacion: 0.0   # inclinacion hacia adelante/atras, en grados

resourcepack:
  enabled: true
  force: true
  port: 28765          # Puerto del servidor HTTP interno que sirve el .zip
  public-ip: ''        # IP publica del server. Si vacio, se auto-detecta

# Tecla configurable para abrir mochila via /trigger:
# 1. Copia plugins/Rucksack/datapack/ a world/datapacks/
# 2. Ejecuta /reload en el servidor
# 3. En Minecraft: Opciones > Controles > busca "trigger mochila" y asigna tu tecla (por defecto B)
